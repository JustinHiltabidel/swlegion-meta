[project]
name = "swlegion-meta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JustinHiltabidel", email = "justin.hiltabidel@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[project.scripts]
swlegion-meta = "swlegion_meta:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
